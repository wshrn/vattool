[package]
name = "vattool"
version = "0.1.0"
authors = ["知攻系统"]
edition = "2021"

[build-dependencies]
reqwest = { version = "0.11", features = ["blocking", "json", "rustls-tls"] }
anyhow = "1"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tauri = { version = "1.5", features = ["dialog-all", "path-all", "shell-open", "window-all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync"] }
sha2 = "0.10"
aes-gcm = { version = "0.10", features = ["aes"] }
rsa = "0.9"
base64 = "0.22"
once_cell = "1.19"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde", "clock"] }
get_if_addrs = "0.5"
hostname = "0.3"
if-addrs = "0.7"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde", "fast-rng"] }
anyhow = "1"
dirs = "5"
winreg = { version = "0.52", optional = true }
windows-registry = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-registry = "0.3"

[features]
default = []

[package.metadata.tauri]
icon-asset-path = "icons/app-icon.png"
