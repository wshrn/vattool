[package]
name = "python-env-switcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.10", features = ["aes"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde", "clock"] }
get_if_addrs = "0.5"
hostname = "0.3"
once_cell = "1.19"
rand = "0.8"
regex = "1.10"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "1.5", features = ["dialog", "fs-all", "path-all", "shell-open"] }
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "fs"] }
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }

[target."cfg(target_os = \"windows\")".dependencies]
winreg = { version = "0.52", features = ["transactions"] }
windows-sys = { version = "0.52", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = "symbols"
codegen-units = 1
lto = true
