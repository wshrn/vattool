[package]
name = "vattool"
version = "0.1.0"
edition = "2021"

build = "build.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.10", features = ["alloc"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
get_if_addrs = "0.5"
hostname = "0.3"
machine-uid = "0.4"
once_cell = "1.19"
rand = "0.8"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tauri = { version = "1.5", features = ["window-all", "dialog-all", "shell-open", "path-all", "fs-read-file", "fs-write-file"] }
tokio = { version = "1.39", features = ["fs", "macros", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
tauri-build = "2"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
