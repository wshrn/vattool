[package]
name = "python-env-switcher"
version = "0.1.0"
edition = "2021"
description = "Python 环境初始化工具"
authors = ["Zhigong"]

[build-dependencies]
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
anyhow = "1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1.5", features = ["api-all"] }
thiserror = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "fs"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.21"
aes-gcm = "0.10"
rsa = { version = "0.9", features = ["pkcs1v15", "serde", "pem"] }
sha2 = "0.10"
rand = "0.8"
get_if_addrs = "0.5"
hostname = "0.3"
uuid = { version = "1", features = ["v4"] }
windows-registry = { version = "0.2", optional = true }
async-process = "1"
dirs-next = "2"
lazy_static = "1"
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
widestring = "1"
winapi = { version = "0.3", features = ["winuser", "processthreadsapi", "memoryapi"] }

[features]
default = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
