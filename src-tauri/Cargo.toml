[package]
name = "python-env-tool"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
aes-gcm = { version = "0.10", features = ["aes256", "alloc"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs-next = "2.0"
hostname = "0.3"
if_addrs = "0.7"
once_cell = "1.19"
parking_lot = "0.12"
rand = "0.8"
rsa = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tauri = { version = "1.5", features = ["api-all"] }
tokio = { version = "1.37", features = ["fs", "sync", "macros", "rt-multi-thread"] }
uuid = { version = "1.7", features = ["v4", "serde"] }
machine-uid = "0.5"
url = "2.5"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
ureq = { version = "2.9", features = ["tls"] }
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["png", "ico"] }
icns = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = []
